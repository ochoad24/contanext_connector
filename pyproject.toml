[project]
name = "contanext_connector"
authors = [{ name = "ContaNext", email = "engineering@contanext.invalid" }]
description = "Integración segura entre sitios Frappe y ContaNext SaaS"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"
